spring:
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 多个文件总大小
      max-request-size: 100MB
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_mybatis?characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: root
  profiles:
    active: dev

logging:
  config: classpath:logback-spring.xml
  level:
    org.mybatis: debug
    cn.alex.mybatis.mapper: debug

# mybatis和mybatis-plus只能配置一个
mybatis:
  # mapper.xml所在位置
  mapper-locations: classpath:cn/alex/mybatis/mapper/**/*Mapper.xml
  # 实体类添加别名
  type-aliases-package: cn.alex.mybatis.domain
  configuration:
    # 开启支持驼峰命名
    map-underscore-to-camel-case: true
    # 配置打印日志
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl