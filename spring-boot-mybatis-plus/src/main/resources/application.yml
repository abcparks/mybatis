spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_mybatis?characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: root
  profiles:
    active: dev
# logging.config与log-impl: org.apache.ibatis.logging.stdout.StdOutImpl 配置
# log-impl: org.apache.ibatis.logging.stdout.StdOutImpl 只管 MyBatis 的 SQL 日志
# logging.config 管其他所有日志
# 如果两个都配置了, 控制台sql日志由log-impl: org.apache.ibatis.logging.stdout.StdOutImpl打印
# 所以建议都由日志框架管理(logging.config)
logging:
  config: classpath:logback-spring.xml
  level:
    root: info
    cn.alex.mybatis.plus.mapper: debug

# mybatis和mybatis-plus只能配置一个
mybatis-plus:
  # mapper.xml所在位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类添加别名
  type-aliases-package: cn.alex.mybatis.plus.domain
  configuration:
    # 开启支持驼峰命名
    mapUnderscoreToCamelCase: true
    # 配置打印日志
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 设置实体类所对应表统一前缀
      table-prefix:
      # 设置统一的主键生成策略
      id-type: auto
  # 扫描通用枚举包
  type-enums-package: cn.alex.mybatis.plus.enums
